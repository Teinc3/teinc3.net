name: Deploy to Github Pages

on:
  push:
    branches: ["main"]
    
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Teinc3/teinc3.github.io'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
     
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm start
      
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-public:
    if: github.repository == 'Teinc3/teinc3.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strip private content from history
        run: |
          pip install git-filter-repo
          git filter-repo --force --invert-paths \
            --path markdowns/ \
            --path assets/pictures/ \
            --path assets/m2poly_placement.png \
            --path "2024-03-17-05-32-15.md" \
            --path "2024-03-17-05-33-28.md" \
            --path "2024-03-17-05-36-20.md" \
            --path "English Food.md" \
            --path "Life Goals.md" \
            --prune-empty always

      - name: Push structural history to public repo
        env:
          SSH_KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git push git@github.com:Teinc3/teinc3.net.git HEAD:main --tags --force
